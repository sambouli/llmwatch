<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmwatch</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 20px;
           border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12px; }
  main { padding:16px 20px 40px; max-width:1200px; margin:0 auto; }
  .targets { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .chip { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:8px 12px; min-width:200px; }
  .chip .name { font-weight:700; }
  .chip .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .up .dot{background:var(--green);} .down .dot{background:var(--red);}
  .chip .meta { color:var(--dim); font-size:11px; margin-top:3px; white-space:pre-wrap; word-break:break-all;}
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .card h3 { margin:0 0 2px; font-size:12.5px; word-break:break-all; }
  .card .lbl { color:var(--dim); font-size:11px; margin-bottom:6px; word-break:break-all;}
  .card .val { font-size:19px; font-weight:700; }
  .card .rate { color:var(--accent); font-size:11.5px; margin-left:8px; font-weight:400;}
  canvas { width:100%; height:52px; display:block; margin-top:6px; }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
  select,input[type=text] { background:var(--bg); color:var(--fg); border:1px solid var(--border);
          border-radius:6px; padding:4px 8px; font:inherit; }
  header .tools { margin-left:auto; display:flex; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>llmwatch</h1>
  <span class="sub" id="clock">—</span>
  <div class="tools">
    <input type="text" id="filter" placeholder="filter metrics…" size="18">
  </div>
</header>
<main>
  <div class="targets" id="targets"></div>
  <div class="grid" id="cards"><div class="empty">waiting for first scrape…</div></div>
</main>
<script>
const REFRESH_MS = 5000;

function fmt(v){
  if (v === null || v === undefined || isNaN(v)) return '–';
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2)+'G';
  if (a >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (a >= 1e3) return (v/1e3).toFixed(1)+'k';
  if (a !== 0 && a < 0.01) return v.toExponential(1);
  if (Number.isInteger(v)) return String(v);
  return v.toFixed(a < 10 ? 3 : 1);
}

function sparkline(cv, vals){
  const ctx = cv.getContext('2d');
  const w = cv.width = cv.clientWidth * devicePixelRatio;
  const h = cv.height = cv.clientHeight * devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  if (!vals || vals.length < 2) return;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.4 * devicePixelRatio;
  ctx.beginPath();
  vals.forEach((v,i)=>{
    const x = i/(vals.length-1)*w;
    const y = h - ((v-lo)/(hi-lo))*(h*0.9) - h*0.05;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = 'rgba(88,166,255,.12)';
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
}

function labelString(labels){
  if (!labels) return '';
  return Object.entries(labels).filter(([k])=>k!=='__target__')
    .map(([k,v])=>`${k}=${v}`).join(' ');
}

async function tick(){
  let data;
  try {
    const r = await fetch('/api/state', {cache:'no-store'});
    data = await r.json();
  } catch(e) {
    document.getElementById('clock').textContent = 'disconnected: '+e;
    return;
  }
  document.getElementById('clock').textContent =
    'updated ' + new Date().toLocaleTimeString() + ' · refresh ' + (REFRESH_MS/1000) + 's';

  const tEl = document.getElementById('targets');
  tEl.innerHTML = '';
  for (const t of (data.targets||[])) {
    const d = document.createElement('div');
    d.className = 'chip ' + (t.up ? 'up' : 'down');
    const info = t.info ? Object.entries(t.info).map(([k,v])=>`${k}: ${v}`).join('\n') : '';
    d.innerHTML = `<span class="dot"></span><span class="name">${esc(t.name)}</span>
      <div class="meta">${esc(t.kind)} · ${t.series} series · ${t.duration_ms}ms${t.up?'':'<br>'+esc(t.error||'down')}</div>
      ${info?`<div class="meta">${esc(info)}</div>`:''}`;
    tEl.appendChild(d);
  }

  const filter = document.getElementById('filter').value.toLowerCase();
  const cEl = document.getElementById('cards');
  cEl.innerHTML = '';
  let shown = 0;
  const series = data.series || {};
  for (const target of Object.keys(series).sort()) {
    for (const s of series[target]) {
      const key = (target+' '+s.name+' '+labelString(s.labels)).toLowerCase();
      if (filter && !key.includes(filter)) continue;
      const card = document.createElement('div');
      card.className = 'card';
      const rate = s.per_sec !== undefined && s.per_sec !== 0
        ? `<span class="rate">▲ ${fmt(s.per_sec)}/s</span>` : '';
      card.innerHTML = `<h3>${esc(target)} / ${esc(s.name)}</h3>
        <div class="lbl">${esc(labelString(s.labels))}</div>
        <div class="val">${fmt(s.last)}${rate}</div>
        <canvas></canvas>`;
      cEl.appendChild(card);
      sparkline(card.querySelector('canvas'), s.values);
      shown++;
    }
  }
  if (!shown) cEl.innerHTML = '<div class="empty">no series match</div>';
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('filter').addEventListener('input', tick);
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
