<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmwatch</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:10px; padding:12px 20px;
           border-bottom:1px solid var(--border); flex-wrap:wrap; position:sticky; top:0;
           background:var(--bg); z-index:5; }
  header h1 { font-size:16px; margin:0 8px 0 0; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:11px; margin-left:auto; }
  select,input[type=text],button { background:var(--panel); color:var(--fg); border:1px solid var(--border);
          border-radius:6px; padding:4px 8px; font:inherit; }
  button.cur { border-color:var(--accent); color:var(--accent); }
  main { padding:14px 20px 60px; max-width:1500px; margin:0 auto; }
  .targets { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .chip { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:8px 12px; min-width:200px; }
  .chip .name { font-weight:700; }
  .chip .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .up .dot{background:var(--green);} .down .dot{background:var(--red);}
  .chip .meta { color:var(--dim); font-size:11px; margin-top:3px; white-space:pre-wrap; word-break:break-all;}
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px 8px; }
  .card h3 { margin:0 0 6px; font-size:12.5px; word-break:break-all; }
  .card h3 .tgt { color:var(--dim); font-weight:400; }
  canvas.plot { width:100%; height:150px; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:11px; }
  .legend .li { display:inline-flex; align-items:center; gap:5px; color:var(--dim); cursor:pointer; }
  .legend .li.off { opacity:.35; text-decoration:line-through; }
  .legend .sw { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>llmwatch</h1>
  <input type="text" id="filter" placeholder="filter metrics…" size="20">
  <span id="ranges"></span>
  <span class="sub" id="clock">—</span>
</header>
<main>
  <div class="targets" id="targets"></div>
  <div class="grid" id="cards"><div class="empty">waiting for first scrape…</div></div>
</main>
<script>
'use strict';
const REFRESH_MS = 5000;
const RANGES = [['1h',3600e3],['6h',216e5],['24h',864e5],['7d',6048e5],['30d',2592e6]];
let rangeMs = 24*3600e3;

/* ---------- formatting ---------- */
// unit inference from metric name; first match wins
const UNIT_RULES = [
  [/_ms$/,                        v => fmtNum(v)+' ms'],
  [/_seconds$/,                   v => v>=1 ? fmtNum(v)+' s' : fmtNum(v*1000)+' ms'],
  [/(_bytes|size_bytes|vram_bytes)$/, v => fmtBytes(v)],
  [/usd/,                         v => '$'+(Math.abs(v)<1 ? v.toFixed(4) : v.toFixed(2))],
  [/(_rate$|hit_rate|usage_perc|share$)/, v => (v*100).toFixed(1)+' %'],
  [/tok_per_sec/,                 v => fmtNum(v)+' tok/s'],
];
function makeFormatter(name){
  for (const [re,f] of UNIT_RULES) if (re.test(name)) return f;
  return v => fmtNum(v);
}
function fmtNum(v){
  if (v===null||v===undefined||isNaN(v)) return '–';
  const a=Math.abs(v);
  if (a>=1e9) return (v/1e9).toFixed(2)+'G';
  if (a>=1e6) return (v/1e6).toFixed(2)+'M';
  if (a>=1e3) return (v/1e3).toFixed(1)+'k';
  if (a!==0 && a<0.01) return v.toExponential(1);
  if (Number.isInteger(v)) return String(v);
  return v.toFixed(a<10?2:1);
}
function fmtBytes(v){
  const u=['B','KiB','MiB','GiB','TiB']; let i=0;
  while (Math.abs(v)>=1024 && i<u.length-1){ v/=1024; i++; }
  return (i===0?String(Math.round(v)):v.toFixed(1))+' '+u[i];
}
function fmtTick(ts, span){
  const d=new Date(ts);
  if (span > 2*864e5) return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:false});
}

/* ---------- chart ---------- */
function decimate(ts, values, maxPts){
  if (ts.length<=maxPts) return {ts, values};
  const bucket=ts.length/maxPts, ots=[], ovals=[];
  for (let b=0;b<maxPts;b++){
    let lo=Infinity, hi=-Infinity, loI=b*bucket, hiI=loI+bucket-1;
    const i0=Math.floor(loI), i1=Math.min(Math.ceil(hiI), ts.length-1);
    for (let i=i0;i<=i1;i++){ const v=values[i]; if(v<lo){lo=v;loI=i;} if(v>hi){hi=v;hiI=i;} }
    // emit min then max in time order within the bucket
    if (loI<=hiI){ ots.push(ts[loI]); ovals.push(lo); if(hi!==lo){ots.push(ts[hiI]); ovals.push(hi);} }
    else { ots.push(ts[hiI]); ovals.push(hi); ots.push(ts[loI]); ovals.push(lo); }
  }
  return {ts:ots, values:ovals};
}

const PALETTE = ['#58a6ff','#3fb950','#f85149','#d2a8ff','#f0883e','#39c5cf','#db61a2','#7ee787','#ffa657','#a5d6ff'];

function drawChart(cv, seriesList, fmt){
  const ctx = cv.getContext('2d');
  const dpr = devicePixelRatio||1;
  const W = cv.width = cv.clientWidth*dpr, H = cv.height = cv.clientHeight*dpr;
  const padL = 56*dpr, padR = 8*dpr, padT = 8*dpr, padB = 18*dpr;
  ctx.clearRect(0,0,W,H);
  const now = Date.now();
  const t0 = now - rangeMs;

  // y bounds over visible window
  let lo=Infinity, hi=-Infinity, any=false;
  for (const s of seriesList){
    if (s.hidden) continue;
    for (let i=0;i<s.ts.length;i++){
      if (s.ts[i]<t0) continue;
      const v=s.values[i]; any=true;
      if (v<lo) lo=v; if (v>hi) hi=v;
    }
  }
  if (!any){ ctx.fillStyle='#8b949e'; ctx.font=(11*dpr)+'px monospace';
    ctx.fillText('no data in range', padL, H/2); return; }
  if (lo===hi){ lo-=Math.max(Math.abs(lo)*0.1,1); hi+=Math.max(Math.abs(hi)*0.1,1); }
  const padY=(hi-lo)*0.08; lo-=padY; hi+=padY;
  const X=ts=>padL+(ts-t0)/rangeMs*(W-padL-padR);
  const Y=v=>H-padB-(v-lo)/(hi-lo)*(H-padT-padB);

  // grid + axes
  ctx.strokeStyle='#21262d'; ctx.fillStyle='#8b949e';
  ctx.font=(10*dpr)+'px monospace'; ctx.lineWidth=1;
  const ySteps=4;
  for (let i=0;i<=ySteps;i++){
    const v=lo+(hi-lo)*i/ySteps, y=Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(fmt(v), padL-6*dpr, y);
  }
  const xSteps=5;
  ctx.textAlign='center'; ctx.textBaseline='top';
  for (let i=0;i<=xSteps;i++){
    const ts=t0+rangeMs*i/xSteps, x=X(ts);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.fillText(fmtTick(ts,rangeMs), x, H-padB+3*dpr);
  }

  // lines
  const visible = seriesList.filter(z=>!z.hidden).length;
  seriesList.forEach((s,si)=>{
    if (s.hidden || s.ts.length<2) return;
    const col=PALETTE[(s.ci!==undefined?s.ci:si)%PALETTE.length];
    ctx.strokeStyle=col; ctx.lineWidth=1.5*dpr; ctx.beginPath();
    let started=false, firstX=null, lastX=null;
    const d = decimate(s.ts, s.values, 500);
    for (let i=0;i<d.ts.length;i++){
      if (d.ts[i]<t0) continue;
      const x=X(d.ts[i]), y=Y(d.values[i]);
      if (!started){ ctx.moveTo(x,y); firstX=x; started=true; }
      else ctx.lineTo(x,y);
      lastX=x;
    }
    ctx.stroke();
    // fill under single-series charts only
    if (started && visible===1){
      ctx.fillStyle=col+'22'; ctx.lineTo(lastX,H-padB); ctx.lineTo(firstX,H-padB);
      ctx.closePath(); ctx.fill();
    }
  });
}

/* ---------- grouping: one card per (target, metric), all tag values overlaid ---------- */
function baseName(name){ return name.replace(/\{quantile=[^}]*\}$/,''); }
function groupSeries(target, arr){
  const groups = new Map();
  for (const s of arr){
    const key = target+'\u0000'+baseName(s.name);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  return groups;
}
function seriesLabel(s){
  const parts=[];
  if (s.labels) for (const [k,v] of Object.entries(s.labels)) parts.push(k+'='+v);
  const q = s.name.match(/\{quantile=([^}]*)\}$/);
  if (q) parts.push('p'+q[1].replace(/^0\./,''));
  return parts.length?parts.join(' '):'value';
}

/* ---------- render ---------- */
const hidden = new Set();   // "groupKey\u0000label"
const colorSlots = new Map(); // "groupKey\u0000label" -> palette index (stable across renders)
function colorSlot(k){
  if (!colorSlots.has(k)) colorSlots.set(k, colorSlots.size);
  return colorSlots.get(k);
}
let lastState=null;

async function tick(){
  try {
    const r = await fetch('/api/state',{cache:'no-store'});
    lastState = await r.json();
    document.getElementById('clock').textContent =
      'updated '+new Date().toLocaleTimeString()+' · refresh '+(REFRESH_MS/1000)+'s';
  } catch(e){
    document.getElementById('clock').textContent='disconnected: '+e;
    return;
  }
  render();
}

function render(){
  if (!lastState) return;
  const data=lastState;
  const tEl=document.getElementById('targets');
  tEl.innerHTML='';
  for (const t of (data.targets||[])){
    const d=document.createElement('div');
    d.className='chip '+(t.up?'up':'down');
    const info=t.info?Object.entries(t.info).map(([k,v])=>`${k}: ${v}`).join('\n'):'';
    d.innerHTML=`<span class="dot"></span><span class="name">${esc(t.name)}</span>
      <div class="meta">${esc(t.kind)} · ${t.series} series · ${t.duration_ms}ms${t.up?'':'<br>'+esc(t.error||'down')}</div>
      ${info?`<div class="meta">${esc(info)}</div>`:''}`;
    tEl.appendChild(d);
  }

  const filter=document.getElementById('filter').value.toLowerCase();
  const cEl=document.getElementById('cards');
  cEl.innerHTML='';
  let shown=0;
  const series=data.series||{};
  for (const target of Object.keys(series).sort()){
    const groups=groupSeries(target, series[target]);
    for (const [key,list] of [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){
      const [tgt,name]=key.split('\u0000');
      const labels=list.map(seriesLabel);
      const hit = !filter || (tgt+' '+name).toLowerCase().includes(filter)
                       || labels.some(l=>l.toLowerCase().includes(filter));
      if (!hit) continue;
      const fmt=makeFormatter(name);
      const card=document.createElement('div');
      card.className='card';
      card.innerHTML=`<h3><span class="tgt">${esc(tgt)} /</span> ${esc(name)}</h3><canvas class="plot"></canvas><div class="legend"></div>`;
      cEl.appendChild(card);
      const cv=card.querySelector('canvas'), lg=card.querySelector('.legend');
      const drawn=list.map((s,i)=>({
        ts:s.ts, values:s.values, label:labels[i],
        ci: colorSlot(key+'\u0000'+labels[i]),
        hidden: hidden.has(key+'\u0000'+labels[i]),
      }));
      drawChart(cv,drawn,fmt);
      list.forEach((s,i)=>{
        const li=document.createElement('span');
        li.className='li'+(drawn[i].hidden?' off':'');
        li.innerHTML=`<span class="sw" style="background:${PALETTE[drawn[i].ci%PALETTE.length]}"></span>${esc(drawn[i].label)} <b style="color:var(--fg)">${fmt(s.last)}</b>`;
        li.onclick=()=>{ const k=key+'\u0000'+drawn[i].label; hidden.has(k)?hidden.delete(k):hidden.add(k); render(); };
        lg.appendChild(li);
      });
      shown++;
    }
  }
  if (!shown) cEl.innerHTML='<div class="empty">no series match</div>';
}

function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- range buttons ---------- */
const rangesEl=document.getElementById('ranges');
for (const [lbl,ms] of RANGES){
  const b=document.createElement('button');
  b.textContent=lbl; b.className = ms===rangeMs?'cur':'';
  b.onclick=()=>{ rangeMs=ms;
    for (const x of rangesEl.children) x.classList.remove('cur');
    b.classList.add('cur'); render(); };
  rangesEl.appendChild(b);
}

document.getElementById('filter').addEventListener('input', render);
window.addEventListener('resize', ()=>render());
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
